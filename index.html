<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congratulations!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .card {
            background-color: white;
            
            /* Responsive Square Rules */
            width: 90%; /* Shrinks on small phones */
            max-width: 400px; /* Stops growing on computer screens */
            aspect-ratio: 1 / 1; /* Keeps it perfectly square no matter the size */
            
            box-sizing: border-box;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            
            /* Centers everything vertically and horizontally */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            animation: bounceIn 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        h1 {
            color: #ff4757;
            font-size: 2.2rem; /* Scaled down slightly so it doesn't wrap awkwardly on phones */
            margin: 0 0 10px 0;
        }

        p {
            color: #2f3542;
            font-size: 1.1rem; 
            margin: 0;
        }

        .emoji {
            font-size: 3.5rem;
            margin-bottom: 15px;
        }

        /* Fun bounce animation when the page loads */
        @keyframes bounceIn {
            0% {
                transform: scale(0.1);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="emoji">🎉🏆🥳</div>
        <h1>Congratulations!</h1>
        <p>You did an amazing job. We are so proud of you!</p>
    </div>

</body>
</html>
